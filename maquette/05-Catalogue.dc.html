<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SAVAA · Résultats de recherche</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/d7691cb4d7e8633274c8d78741302bcf">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="hdr" style="gap: 2px; padding-right: 12px">
    <a class="iconbtn" href="02-Accueil.dc.html" aria-label="Retour"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
    <div class="search grow" style="height: 42px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="color: #17201B">taurillon</span></div>
  </div>
  <div style="background: #fff; border-bottom: 1px solid #E3E7E4; padding: 10px 16px; flex: none; display: flex; flex-direction: column; gap: 10px">
    <div class="chips">
      <span class="chip"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filtres (3)</span>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button class="{{c.cls}}" onClick="{{c.pick}}">{{c.t}}</button>
      </sc-for>
    </div>
    <div class="row between small"><span class="muted num">{{count}} résultats, Poro et Tchologo</span><span class="b">Tri : pertinence</span></div>
  </div>
  <div class="body" style="padding: 12px 16px; gap: 10px">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{skel}}" as="k" hint-placeholder-count="3">
        <div class="hc" aria-hidden="true"><div class="ph" style="background: #E9ECEA"></div><div class="col grow" style="gap: 9px; padding-top: 4px"><div style="height: 12px; width: 80%; background: #E9ECEA; border-radius: 3px"></div><div style="height: 10px; width: 55%; background: #EEF0EE; border-radius: 3px"></div><div style="height: 14px; width: 40%; background: #E9ECEA; border-radius: 3px"></div><div style="height: 10px; width: 65%; background: #EEF0EE; border-radius: 3px"></div></div></div>
      </sc-for>
    </sc-if>
    <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
      <a class="hc" href="06-Annonce.dc.html">
        <div class="ph"><span>{{p.ph}}</span></div>
        <div class="col grow" style="gap: 3px">
          <sc-if value="{{p.sp}}" hint-placeholder-val="{{ false }}"><span class="badge bd-sp" style="align-self: flex-start">Sponsorisé</span></sc-if>
          <span class="b small" style="line-height: 1.3">{{p.t}}</span>
          <span class="xs muted ell">{{p.d}}</span>
          <span class="price">{{p.price}}</span>
          <span class="xs muted ell">{{p.loc}}</span>
          <span class="wrap" style="gap: 4px; margin-top: 2px"><span class="badge {{p.vc}}">{{p.v}}</span><span class="badge {{p.tc}}">{{p.tr}}</span></span>
        </div>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div class="card pad col" style="align-items: center; text-align: center; gap: 8px; padding: 28px 20px">
        <span class="b">Aucune annonce avec ces filtres</span>
        <span class="small muted">Élargissez la zone ou retirez un filtre.</span>
        <button class="btn btn-s btn-sm" onClick="{{reset}}">Réinitialiser les filtres</button>
      </div>
    </sc-if>
  </div>
  <nav class="tabbar">
    <a class="tab" href="02-Accueil.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
    <a class="tab on" href="05-Catalogue.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Explorer</a>
    <a class="tab" href="13-Publier.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg>Vendre</a>
    <a class="tab" href="08-Tableau-eleveur.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Suivi</a>
    <a class="tab" href="23-Profil.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Compte</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { verif: true, deliv: false, trace: false, loading: true }; }
  componentDidMount() { this.t = setTimeout(() => this.setState({ loading: false }), 900); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    const all = [
      { sp: true, t: 'Taurillons Zébu, lot de 3', d: '18 à 22 mois, 260 à 290 kg', price: '1 680 000 FCFA le lot', loc: 'Ferkessédougou, 54 km, Ranch Tuo', ph: 'Photo, lot', v: 'Compte vérifié', vc: 'bd-green', tr: '3 fiches', tc: 'bd-blue', ok: true, del: true, tra: true },
      { t: 'Taurillon Zébu Goudali', d: '26 mois, 312 kg, pesé le 04/11', price: '650 000 FCFA', loc: 'Sinématiali, 12 km, Ferme Koné', ph: 'Photo, taurillon', v: 'Compte vérifié', vc: 'bd-green', tr: 'Fiche vérifiée', tc: 'bd-green', ok: true, del: true, tra: true },
      { t: 'Taurillon N’Dama', d: '20 mois, poids non renseigné', price: '415 000 FCFA', loc: 'Korhogo, 4 km, Bamba S.', ph: 'Photo, N’Dama', v: 'Non vérifié', vc: 'bd-grey', tr: 'Fiche déclarée', tc: 'bd-grey', ok: false, del: false, tra: true },
      { t: 'Taurillon métis Goudali × N’Dama', d: '24 mois, 275 kg', price: '560 000 FCFA, négociable', loc: 'Napiéolédougou, 22 km, Ferme Silué', ph: 'Photo, métis', v: 'Compte vérifié', vc: 'bd-green', tr: 'Fiche documentée', tc: 'bd-blue', ok: true, del: false, tra: true }
    ];
    const items = all.filter((p) => (!s.verif || p.ok) && (!s.deliv || p.del));
    const C = [['verif', 'Vendeur vérifié'], ['deliv', 'Livraison'], ['trace', 'Avec fiche animale']];
    return {
      chips: [{ t: 'Bovins', cls: 'chip on', pick: () => {} }].concat(C.map(([k, t]) => ({ t, cls: s[k] ? 'chip on' : 'chip', pick: () => this.setState({ [k]: !s[k] }) }))),
      items: s.loading ? [] : items, skel: [1, 2, 3], loading: s.loading, count: s.loading ? '…' : items.length, empty: !s.loading && items.length === 0,
      reset: () => this.setState({ verif: false, deliv: false, trace: false })
    };
  }
}
</script>
</body>
</html>
