<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SAVAA · Cheptel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/d7691cb4d7e8633274c8d78741302bcf">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app">
  <div class="hdr">
    <a class="iconbtn" href="08-Tableau-eleveur.dc.html" aria-label="Retour"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a>
    <h1>Cheptel (46)</h1>
    <a class="iconbtn" href="09b-Ajout-animal.dc.html" aria-label="Ajouter un animal"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  </div>
  <div style="background: #fff; border-bottom: 1px solid #E3E7E4; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; flex: none">
    <div class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span>N° interne, identifiant officiel, nom</span></div>
    <div class="chips">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button class="{{f.cls}}" onClick="{{f.pick}}">{{f.t}} <span class="n">{{f.n}}</span></button>
      </sc-for>
      <span class="chip"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Statut</span>
    </div>
  </div>
  <div class="body" style="padding: 12px 16px; gap: 8px">
    <span class="xs muted">{{count}} affichés, tri par n° interne</span>
    <div class="card list">
      <sc-for list="{{rows}}" as="a" hint-placeholder-count="7">
        <a class="li" href="{{a.href}}">
          <div class="ph" style="width: 48px; height: 48px; border-radius: 6px; padding: 0"></div>
          <div class="col grow" style="gap: 2px">
            <span class="row" style="gap: 6px"><span class="b small num">{{a.id}}</span><span class="small ell">{{a.t}}</span></span>
            <span class="xs muted ell">{{a.d}}</span>
          </div>
          <span class="badge {{a.bc}}">{{a.b}}</span>
        </a>
      </sc-for>
    </div>
  </div>
  <div class="foot">
    <a class="btn btn-p" href="09b-Ajout-animal.dc.html">Ajouter un animal</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all' }; }
  renderVals() {
    const all = [
      { sp: 'bov', id: 'FK-0142', t: 'Taurillon Zébu Goudali', d: 'Mâle, 26 mois, 312 kg', b: 'En vente', bc: 'bd-sp', href: '07-Fiche-animale.dc.html' },
      { sp: 'bov', id: 'FK-0087', t: 'Vache N’Dama', d: 'Femelle, 5 ans, gestante', b: 'À jour', bc: 'bd-green', href: '07-Fiche-animale.dc.html' },
      { sp: 'bov', id: 'FK-0091', t: 'Génisse métisse', d: 'Femelle, 19 mois, 241 kg', b: 'À jour', bc: 'bd-green', href: '07-Fiche-animale.dc.html' },
      { sp: 'ovi', id: 'FK-0119', t: 'Brebis Djallonké', d: 'Femelle, 3 ans, alerte ouverte', b: 'Alerte', bc: 'bd-red', href: '10-Dossier-sanitaire.dc.html' },
      { sp: 'ovi', id: 'FK-0124', t: 'Bélier Sahélien', d: 'Mâle, 2 ans, 58 kg', b: 'Rappel dû', bc: 'bd-amber', href: '07-Fiche-animale.dc.html' },
      { sp: 'ovi', id: 'FK-0125', t: 'Bélier Sahélien', d: 'Mâle, 2 ans, 61 kg', b: 'Sous traitement', bc: 'bd-blue', href: '07-Fiche-animale.dc.html' },
      { sp: 'cap', id: 'FK-0133', t: 'Chèvre Djallonké', d: 'Femelle, 2 ans', b: 'À jour', bc: 'bd-green', href: '07-Fiche-animale.dc.html' },
      { sp: 'bov', id: 'FK-0150', t: 'Veau N’Dama', d: 'Mâle, 3 mois, ID à renseigner', b: 'ID manquant', bc: 'bd-grey', href: '07-Fiche-animale.dc.html' }
    ];
    const F = [['all', 'Tous', 46], ['bov', 'Bovins', 18], ['ovi', 'Ovins', 22], ['cap', 'Caprins', 6]];
    const cur = this.state.f;
    const rows = all.filter((a) => cur === 'all' || a.sp === cur);
    return {
      filters: F.map(([id, t, n]) => ({ t, n, cls: cur === id ? 'chip on' : 'chip', pick: () => this.setState({ f: id }) })),
      rows, count: rows.length
    };
  }
}
</script>
</body>
</html>
